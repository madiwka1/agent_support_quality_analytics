<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор чек-листа</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #f4f7f5; font: 14px "Inter","Segoe UI", system-ui, sans-serif; }
    a.back { display: inline-flex; margin: 14px 16px 0; padding: 7px 18px; border-radius: 999px; background: #178a3f; color: #fff; font-weight: 600; text-decoration: none; }
    a.back:hover { background: #0f6f31; }
  </style>
</head>
<body>
  <a class="back" href="/" onclick="if (history.length > 1) { history.back(); return false; }">Назад</a>
  <cqa-checklist-editor api-base=""></cqa-checklist-editor>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (id) document.querySelector('cqa-checklist-editor').setAttribute('checklist-id', id);
  </script>
  <script src="components/cqa-checklist-editor.js"></script>
</body>
</html>
