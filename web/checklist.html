<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор чек-листа</title>
  <style>
    body { margin: 0; background: #f3f5f4; font: 14px "Segoe UI", system-ui, sans-serif; }
    a.back { display: block; max-width: 1180px; margin: 0 auto; padding: 14px 16px 0; color: #14633f; text-decoration: none; }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a class="back" href="/">&larr; К оценке диалога</a>
  <!-- api-base is empty when served by FastAPI; set it to the backend URL inside Dynamics 365. -->
  <cqa-checklist-editor api-base=""></cqa-checklist-editor>
  <script>
    // Open the checklist chosen on the homepage (?id=3).
    const id = new URLSearchParams(location.search).get('id');
    if (id) document.querySelector('cqa-checklist-editor').setAttribute('checklist-id', id);
  </script>
  <script src="components/cqa-checklist-editor.js"></script>
</body>
</html>
